site_name: Tessera
site_description: The open-source data platform you run yourself.
site_url: https://vvipinthomas.github.io/tessera/
repo_url: https://github.com/vvipinthomas/tessera
repo_name: vvipinthomas/tessera
edit_uri: edit/main/docs/
copyright: Apache License 2.0

theme:
  name: material
  logo: images/logo.svg
  favicon: images/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy, toc.follow]

extra_css: [stylesheets/tessera.css]

nav:
  - Home: index.md
  - User guide: USER_GUIDE.md
  - Deploy: DEPLOY.md
  - Cloudflare: CLOUDFLARE.md
  - Configuration: CONFIGURATION.md
  - Integrations: INTEGRATIONS.md
  - MCP server: MCP.md
  - Enterprise: ENTERPRISE.md
  - Architecture: ARCHITECTURE.md

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
