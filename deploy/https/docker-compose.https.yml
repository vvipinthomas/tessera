# Tessera behind Caddy with automatic HTTPS (Let's Encrypt).
# 1. Point a DNS A/AAAA record for your domain at this server; open ports 80 and 443.
# 2. TESSERA_DOMAIN=tessera.example.com docker compose -f docker-compose.yml -f deploy/https/docker-compose.https.yml up -d --build
services:
  tessera:
    ports: !reset []
    expose: ["8710"]
    environment:
      TESSERA_SECURE_COOKIES: "true"
      # Tessera is reachable only through the proxy here, so its forwarded client address can be trusted
      TESSERA_TRUST_PROXY_HEADERS: "true"
      TESSERA_BASE_URL: "https://${TESSERA_DOMAIN:?set TESSERA_DOMAIN}"

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      TESSERA_DOMAIN: "${TESSERA_DOMAIN}"
    volumes:
      - ./deploy/https/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [tessera]

volumes:
  caddy-data:
  caddy-config:
