name: Deploy to Cloudflare

# Manual deploy of the Worker and the Tessera container to your Cloudflare account.
# Repository secrets needed: CLOUDFLARE_API_TOKEN (Workers Scripts, Containers and R2 edit permissions) and
# CLOUDFLARE_ACCOUNT_ID. Tessera's own secrets are set once with `wrangler secret put` (see docs/CLOUDFLARE.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: cloudflare
    defaults:
      run: {working-directory: cloudflare}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: cloudflare/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
