name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check tessera tests scripts
      - name: Syntax-check the web app
        run: for f in tessera/static/*.js; do node --check "$f"; done
      - run: bandit -q -r tessera -c pyproject.toml
      - run: pip-audit --skip-editable

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TESSERA_TEST_PG: "host=127.0.0.1 port=5432 user=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with: {go-version: "1.24", cache: false}  # the test broker is built by a script, there is no go.mod
      - name: Turn on logical decoding for the mirroring tests
        run: |
          psql "$TESSERA_TEST_PG" -c "ALTER SYSTEM SET wal_level = logical"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 30); do pg_isready -h 127.0.0.1 -p 5432 -U postgres && break; sleep 1; done
          test "$(psql "$TESSERA_TEST_PG" -Atc 'show wal_level')" = logical
      - name: Build the Kafka-protocol test broker
        run: sh tests/kafka_broker/build.sh
      - run: pip install -e ".[dev,mysql,s3,mongodb,delta]"
      - run: pytest -q --cov=tessera --cov-report=term  # fails below the floor in pyproject.toml

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,mysql,s3,mongodb,delta]"
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui_smoke.py --shots ui-shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with: {name: ui-screenshots, path: ui-shots, if-no-files-found: ignore}

  worker:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: cloudflare}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: {node-version: "22", cache: npm, cache-dependency-path: cloudflare/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Wrangler dry run (builds the container image too)
        run: npx wrangler deploy --dry-run --outdir dist

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the image
        run: docker build -t tessera:ci .
      - name: Start it and wait for readiness
        run: |
          docker run -d --name tessera-ci -p 8710:8710 tessera:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8710/api/ready && exit 0; sleep 2; done
          docker logs tessera-ci; exit 1
